<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>מוצר | רוםטק</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=20261001-30">
</head>
<body>
  <a class="skip" href="#main">דלג לתוכן הראשי</a>
  <header class="site-header">
    <div class="container nav">
      <a class="brand brand-logo" href="index.html"><img src="assets/logo-original.webp?v=20261001-30" alt="RomTech"></a>
      <a href="index.html#catalogSection">קטלוג</a>
      <a href="contact.html">צור קשר</a>
    </div>
  </header>

  <main id="main" class="container section">
    <div id="productView"></div>
  </main>

  <div class="modal" id="orderModal" aria-hidden="true">
    <div class="modal-card order-modal-card">
      <div class="module-head">
        <div>
          <div class="small">הזמנה חדשה</div>
          <h2 id="orderProductTitle">הזמן עכשיו</h2>
        </div>
        <button class="icon-btn" id="closeOrderModal" type="button" aria-label="סגור">✕</button>
      </div>
      <form id="orderForm">
        <input type="hidden" id="orderProductId">
        <div class="order-summary" id="orderSummary"></div>
        <div class="form-grid">
          <label>שם מלא<input id="orderName" required autocomplete="name"></label>
          <label>טלפון<input id="orderPhone" required type="tel" autocomplete="tel"></label>
          <label>אימייל<input id="orderEmail" type="email" autocomplete="email"></label>
          <label>עיר<input id="orderCity" autocomplete="address-level2"></label>
          <label class="full">כתובת למשלוח<input id="orderAddress" autocomplete="street-address"></label>
          <label class="full">הערות להזמנה<textarea id="orderNotes" rows="4" placeholder="מידה, התאמות מיוחדות, בקשות נוספות"></textarea></label>
        </div>
        <label class="order-consent"><input id="orderPrivacy" required type="checkbox"> אני מאשר/ת שימוש בפרטים לצורך טיפול בהזמנה</label>
        <div class="actions">
          <button class="btn" type="submit">שלח הזמנה</button>
          <button class="btn secondary" type="button" id="cancelOrder">ביטול</button>
        </div>
        <div id="orderMessage" class="notice success" hidden></div>
      </form>
    </div>
  </div>

  <script src="data.js?v=20261001-30"></script>
  <script src="app.js?v=20260930-29"></script>
  <script src="product.js?v=20261001-30"></script>
</body>
</html>
