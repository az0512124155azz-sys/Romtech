<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>מוצר | רוםטק</title><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"></head><body><a class="skip" href="#main">דלג לתוכן הראשי</a><header class="site-header"><div class="container nav"><a class="brand brand-logo" href="index.html"><img src="assets/logo.svg" alt="RomTech"></a><a href="index.html#catalogSection">קטלוג</a><a href="contact.html">צור קשר</a></div></header><main id="main" class="container section"><div id="productView"></div></main><script src="data.js"></script><script src="app.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{const id=new URLSearchParams(location.search).get("id");const p=RomTechData.loadProducts().find(x=>x.id===id);const r=document.getElementById("productView");if(!p){r.innerHTML="<h1>המוצר לא נמצא</h1>";return}document.title=p.seoTitle||p.name;const img=p.images&&p.images[0]?'<img class="product-main-image" src="'+p.images[0]+'" alt="'+esc(p.name)+'">':'<div class="ph" role="img" aria-label="'+esc(p.name)+'"></div>';r.innerHTML='<div class="hero">'+img+'<div><div class="eyebrow">'+esc(p.court)+' · '+esc(p.category)+'</div><h1 style="font-size:48px">'+esc(p.name)+'</h1><p class="lead">'+esc(p.full)+'</p><div class="price">'+money(p.salePrice||p.price)+(p.salePrice?'<span class="old">'+money(p.price)+'</span>':"")+'</div><p>מלאי זמין: '+p.stock+'</p><div class="actions"><a class="btn" target="_blank" rel="noopener" href="https://wa.me/359879858846?text='+encodeURIComponent("שלום, אשמח להזמין/לקבל פרטים על "+p.name)+'">הזמנה וייעוץ ב-WhatsApp</a></div></div></div><section class="section"><h2>מפרט טכני</h2><div class="specs"><div class="spec">גובה: '+p.height+' ס״מ</div><div class="spec">מספר שיניים: '+p.teeth+'</div><div class="spec">סוג פרווה: '+esc(p.fur)+'</div><div class="spec">צבע בטנה: '+esc(p.lining||"לפי בחירה")+'</div><div class="spec">קופסה: '+esc(p.box||"ללא")+'</div><div class="spec">רקמת שם: '+(p.embroidery?"אפשרית בתוספת "+money(p.embroideryPrice):"לא")+'</div></div></section>'})</script></body></html>
