<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>העדפות עוגיות | רוםטק</title><link rel="stylesheet" href="styles.css"></head><body><main class="legal"><a href="index.html">← חזרה לאתר</a><h1>העדפות עוגיות</h1><form id="cf"><label><input type="checkbox" checked disabled style="width:auto"> הכרחיות — תמיד פעילות</label><p><label><input id="analytics" type="checkbox" style="width:auto"> אנליטיקס</label></p><p><label><input id="marketing" type="checkbox" style="width:auto"> שיווק</label></p><p><label><input id="functional" type="checkbox" style="width:auto"> פונקציונליות</label></p><button class="btn">שמור העדפות</button></form></main><script>const v=JSON.parse(localStorage.rt_cookie||"{}");["analytics","marketing","functional"].forEach(k=>document.getElementById(k).checked=!!v[k]);document.getElementById("cf").onsubmit=e=>{e.preventDefault();localStorage.rt_cookie=JSON.stringify({essential:true,analytics:analytics.checked,marketing:marketing.checked,functional:functional.checked,at:new Date().toISOString()});alert("ההעדפות נשמרו")}</script></body></html>
