name: Build original RomTech logo

on:
  push:
    paths:
      - ".logo-build/READY"

permissions:
  contents: write

jobs:
  build-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild original logo asset
        shell: bash
        run: |
          set -euo pipefail
          cat .logo-build/part*.b64 > /tmp/romtech-logo.b64
          base64 -d /tmp/romtech-logo.b64 > assets/logo-original.webp
          test "$(wc -c < assets/logo-original.webp)" -eq 74746
          echo "22f21f5629195828e5a9853010ef2d8e15567714dbb5f8bf1a807513fe6f926f  assets/logo-original.webp" | sha256sum -c -
          file assets/logo-original.webp

      - name: Commit original logo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/logo-original.webp
          git rm -r .logo-build
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: restore original high-quality RomTech logo"
          git push
