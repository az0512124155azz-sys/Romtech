<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="t d">
<title id="t">RomTech</title><desc id="d">RomTech — שטריימלים ברמה אחרת</desc>
<defs>
  <linearGradient id="gold" x1="0" x2="1"><stop stop-color="#9c6b2c"/><stop offset=".28" stop-color="#d4ae63"/><stop offset=".52" stop-color="#f0d28b"/><stop offset=".74" stop-color="#b9853d"/><stop offset="1" stop-color="#6f451d"/></linearGradient>
  <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b0f0b"/><stop offset=".22" stop-color="#5b331f"/><stop offset=".44" stop-color="#25130d"/><stop offset=".68" stop-color="#744024"/><stop offset="1" stop-color="#120b08"/></linearGradient>
  <radialGradient id="top"><stop stop-color="#3b2418"/><stop offset=".58" stop-color="#17100d"/><stop offset="1" stop-color="#070605"/></radialGradient>
  <filter id="furTex" x="-15%" y="-15%" width="130%" height="130%">
    <feTurbulence type="fractalNoise" baseFrequency=".035 .42" numOctaves="2" seed="7" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values=".2" result="mono"/>
    <feBlend in="SourceGraphic" in2="mono" mode="overlay"/>
  </filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity=".28"/></filter>
  <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="2.4" flood-color="#000" flood-opacity=".28"/></filter>
</defs>
<g filter="url(#shadow)">
  <ellipse cx="500" cy="145" rx="280" ry="105" fill="url(#fur)" filter="url(#furTex)"/>
  <ellipse cx="500" cy="116" rx="194" ry="57" fill="#0c0908"/>
  <ellipse cx="500" cy="120" rx="152" ry="38" fill="url(#top)"/>
  <path d="M220 145 C240 258 310 283 500 283 C690 283 760 258 780 145 C723 190 635 210 500 210 C365 210 277 190 220 145Z" fill="url(#fur)" filter="url(#furTex)"/>
  <path d="M248 157 C283 225 356 245 500 245 C644 245 717 225 752 157" fill="none" stroke="#a86b36" stroke-opacity=".3" stroke-width="9"/>
</g>
<g filter="url(#textShadow)">
  <text x="500" y="382" text-anchor="middle" font-family="Georgia,Times New Roman,serif" font-size="126" font-weight="700" letter-spacing="-6">
    <tspan fill="url(#gold)">Rom</tspan><tspan fill="#141414">Tech</tspan>
  </text>
</g>
<path d="M185 412h255M560 412h255" stroke="url(#gold)" stroke-width="4"/>
<g transform="translate(500 412)">
  <path d="M-18 5 L-11-13 L0-4 L11-13 L18 5 L13 16 L-13 16Z" fill="url(#gold)" stroke="#8e6329" stroke-width="2"/>
  <circle cx="-11" cy="-13" r="3.5" fill="#d8b76f"/><circle cx="0" cy="-4" r="3.5" fill="#d8b76f"/><circle cx="11" cy="-13" r="3.5" fill="#d8b76f"/>
</g>
<text x="500" y="468" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="600" fill="#2b2927">שטריימלים ברמה אחרת</text>
